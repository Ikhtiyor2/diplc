<form class="lang-switch" method="post" action="{% url 'web:set-language' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" name="language" value="ru" class="{% if current_lang == 'ru' %}active{% endif %}" aria-label="{% t "Русский" %}">RU</button>
  <button type="submit" name="language" value="uz" class="{% if current_lang == 'uz' %}active{% endif %}" aria-label="O‘zbekcha">UZ</button>
</form>
